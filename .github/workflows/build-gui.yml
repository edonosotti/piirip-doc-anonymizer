name: Build GUI executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: PII-rip-linux
          - os: windows-latest
            artifact: PII-rip-windows
          - os: macos-latest
            artifact: PII-rip-macos
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
          python -m spacy download en_core_web_lg
      - name: Build executable
        run: ./packaging/build.sh
      - name: Package
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../${{ matrix.artifact }}.zip PII-rip
          else
            tar -czf ../${{ matrix.artifact }}.tar.gz PII-rip*
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
          if-no-files-found: error
